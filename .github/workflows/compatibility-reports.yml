---
name: Compatibility Reports Automation

on:
  issues:
    types: [opened, edited, reopened]

jobs:
  manage-report:
    name: Process Compatibility Report
    if: >-
      ${{ !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'type:compatibility') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Compatibility Report Automation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION_NAME: ${{ github.event.action }}
        run: |
          python3 .github/scripts/manage-compatibility-report.py
