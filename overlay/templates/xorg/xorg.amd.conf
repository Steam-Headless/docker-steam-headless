# https://github.com/Steam-Headless/docker-steam-headless/issues/168#issuecomment-2943219185
Section "Device"
    Identifier  "AMD GPU"
    Driver      "amdgpu"
    Option      "DRI" "3"
    Option      "TearFree" "true"
    Option      "VirtualHeads" "0"
    Option      "SWcursor" "true"
    Option      "CustomEDID" "DisplayPort-0:/etc/X11/edid/edid.bin"
    Option      "IgnoreEDID" "false"
EndSection

Section "Monitor"
    Identifier   "FakeMonitor"
    HorizSync    30.0 - 83.0
    VertRefresh  56.0 - 75.0
    Option       "PreferredMode" "1920x1080"
    Option       "Enable" "true"
    Option       "Primary" "true"
EndSection

Section "Screen"
    Identifier     "Default Screen"
    Device         "AMD GPU"
    Monitor        "FakeMonitor"
    DefaultDepth   24
    SubSection "Display"
        Depth     24
        Modes     "1920x1080"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier     "Layout0"
    Screen         0 "Default Screen"
EndSection
