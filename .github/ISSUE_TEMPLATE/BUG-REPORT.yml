name: Bug Report
description: File a reproducible bug report for Steam Headless
title: '[Bug]: '
labels: ['type:bug']
body:
  - type: markdown
    attributes:
      value: |
        ### Important Notice
        **GitHub issues are strictly reserved for verified software bugs and regressions.**

        If you need configuration assistance, hardware compatibility guidance, or general troubleshooting, please join our [Discord Community](https://streamingtech.co.nz/discord).

        **General support questions or unverified environment issues opened here will be closed immediately and redirected to Discord.**
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Describe the exact steps required to reproduce the issue.
      placeholder: |
        1. Start container with command / Compose configuration '...'
        2. Open SHUI at 'https://<ip>:8483'
        3. Launch Steam or start stream '...'
        4. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Host operating system, GPU model and driver version, container image tag, etc.
      placeholder: |
        - Host OS: Fedora 44 Server / Ubuntu 24.04 / Unraid 7.x
        - GPU: Intel Iris Pro 580 / NVIDIA RTX 3080 / AMD RX 6700 XT
        - Driver Version: e.g. NVIDIA 550.54.14 / Mesa 24.x
        - Container Image: registry.gitlab.com/streamingtech/products/steam-headless/docker-steam-headless-v2:latest
        - Network Mode: host / macvlan
        - Docker Version: 28.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please paste sanitised container logs (`docker logs <container>`) and SHUI journal output. Ensure all passwords, tokens, and personal credentials are removed.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have verified that this issue is reproducible and not a general configuration or hardware setup question.
          required: true
        - label: I understand that support questions opened as GitHub issues will be closed immediately and directed to Discord.
          required: true
        - label: I have removed all sensitive credentials, passwords, and private tokens from my logs.
          required: true
